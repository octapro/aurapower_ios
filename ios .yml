name: Build iOS IPA (unsigned)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npm run assets
      - run: npx cap sync ios
      - run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr AuraPower.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: AuraPower-IPA, path: ios/App/AuraPower.ipa }
